name: Test

on:
  push:
    branches: [ "main" ]
  pull_request:
    branches: [ "main" ]
  workflow_dispatch:
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-node@v6
        with:
          node-version: 'lts/*'
          check-latest: true
      - name: install
        run: npm install
      - name: type-check
        run: npm run tsc
      - name: ESLint
        run: npm run lint
      - name: prettier
        run: npm run prettier
      - name: test
        run: npm run test
      - name: compile
        run: npm run build
